group: ITSC2026_train_MORL
callbacks: [wandb]
experiment_type: intersection_zoo
workers: 13
n_parallel: 1

slurm:
  gpus: 1
  cpus: 13
  mem: 30G

config_overwrite:
- name: chi758
  iz_net_rel_paths:
  - chicago/758/net.net.xml
- name: nyc1078
  iz_net_rel_paths:
  - new-york-city/1078/net.net.xml
- name: la477
  iz_net_rel_paths:
  - los-angeles/477/net.net.xml
- name: la2114
  iz_net_rel_paths:
  - los-angeles/2114/net.net.xml
- name: nyc10802
  iz_net_rel_paths:
  - new-york-city/10802/net.net.xml
- name: slc47
  iz_net_rel_paths:
  - salt-lake-city/47/net.net.xml
- name: sf838
  iz_net_rel_paths:
  - san-francisco/838/net.net.xml
- name: sea543
  iz_net_rel_paths:
  - seattle/543/net.net.xml
- name: chi2412
  iz_net_rel_paths:
  - chicago/2412/net.net.xml
- name: atl66
  iz_net_rel_paths:
  - atlanta/66/net.net.xml
- name: bos666
  iz_net_rel_paths:
  - boston/666/net.net.xml
- name: chi1027
  iz_net_rel_paths:
  - chicago/1027/net.net.xml
- name: dal1082
  iz_net_rel_paths:
  - dallas/1082/net.net.xml

hyperparameters:
  learning_rate: 5.0e-05
  batch_size: 128
  gamma: 0.975
  tau: 0.05
  target_net_update_freq: 500
  gradient_updates: 3
  num_sample_w: 16
  initial_epsilon: 0.1
  final_epsilon: 0.02
  epsilon_decay_steps: 150000
  max_grad_norm: 1.0
  initial_homotopy_lambda: 0.0
  final_homotopy_lambda: 0.3
  homotopy_decay_steps: 200000

base_config:
  agent_id: TL
  random_seed: 5511
  delta_time: 4
  min_green: 20
  step_length: 1
  wandb: false
  morl_enable_algorithm_logging: true
  morl_auto_eval_env: false
  morl_log_weighted_front: false
  morl_periodic_eval: false
  morl_checkpoint_freq_steps: 25000
  morl_checkpoint_upload_to_wandb: false
  morl_checkpoint_select_best_by_hv: true
  morl_checkpoint_hv_metric: pareto_hv_nondom
  morl_checkpoint_hv_episode_window: 64
  morl_checkpoint_hv_ref_point: [0.0, 0.0]
  morl_checkpoint_hv_nondominated_bonus: 0.01
  morl_weight_sampling_bus_schedule:
  - until_step: 150000
    min_bus_weight: 0.1
    max_bus_weight: 0.9
  - until_step: null
    min_bus_weight: 0.0
    max_bus_weight: 1.0
  deterministic: false
  n_vec_envs: 1
  scenario_sampling: sequential
  observation: ObservationFunctionPT
  obs_every_delta_time: true
  add_reward_weights_to_obs: false
  add_mean_delay: true
  add_cvar_delay: true
  add_phase_last_seen: true
  add_distance: true
  add_delay: false
  add_occupancy: false
  reward_weights:
    delay_bus: 1.0
    delay: 1.0
  reward_kwargs:
    delay:
      nonbus_cvar_alpha: 0.1
      nonbus_cvar_threshold: 120.0
      nonbus_cvar_penalty: 0.25
      infeasible_action_penalty: 120.0
  reward_clip: [-600, 100]
  morl_ref_point: [0.0, 0.0]
  reward_scales: {}
  phase_controller: BasicPhaseController
  num_seconds: 10800
  run_up_time: 3600
  time_to_teleport: 300
  total_timesteps: 500_000
  model_output_dir: ITSC_2026/models/morl
  iz_seed: 5511
  iz_bus_gen_seed: 5511
  iz_n_scenarios: 1
  iz_net_rel_paths:
  - chicago/758/net.net.xml
  iz_random_start_time: true
  electric_penetration_rate: 0
  bus_vid_prefix: _42.
  iz_bus_timetable_config:
    route_count: 4
    headway_min_seconds: 300.0
    headway_max_seconds: 900.0
    deviation_min_seconds: -120.0
    deviation_max_seconds: 600.0
    route_duration_min_seconds: 10800
    route_duration_max_seconds: 36000
  morl_algorithm: morl_baselines.multi_policy.envelope.envelope:Envelope
  morl_algorithm_kwargs:
    learning_starts: 4000
    buffer_size: 250000
    per: false
    envelope: false
    seed: 5511
    device: auto
    log: true
  morl_train_method: train
  morl_train_kwargs:
    eval_env: null
