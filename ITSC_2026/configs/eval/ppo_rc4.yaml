group: itsc2026_ppo_rc4_generic_eval
stable_baselines_model: MaskablePPO
callbacks: []
experiment_type: intersection_zoo
workers: 16
n_parallel: 1

slurm:
  gpus: 1
  cpus: 16
  mem: 80G

eval:
  baselines: [fixed_ts, tsp]
  rows_root: ITSC_2026/results/evaluations/ppo_rc4_dataset
  route_seeds: [3423, 3424, 3425, 3426, 3427, 3428, 3429, 3430, 3431, 3432]
  timing_seeds: [3423, 3424, 3425, 3426, 3427, 3428, 3429, 3430, 3431, 3432]
  rows_mode: seed
  rows_append: true
  rows_formatter: ITSC_2026.src.row_formatters:paper_eval_rows
  reward_weight_keys: [mean_delay_bus, mean_delay]

