hyperparameters: {}

base_config:
  random_seed: 3422
  agent_id: TL
  delta_time: 4
  min_green: 20
  step_length: 1
  wandb: false
  deterministic: true
  n_vec_envs: 1
  scenario_sampling: random
  observation: ObservationFunctionPT
  obs_every_delta_time: true
  add_reward_weights_to_obs: false
  add_mean_delay: true
  add_cvar_delay: true
  add_phase_last_seen: true
  add_distance: true
  add_delay: false
  add_occupancy: false
  reward_weights:
    delay_bus: 1.0
    delay: 1.0
  reward_kwargs:
    delay:
      nonbus_cvar_alpha: 0.1
      nonbus_cvar_threshold: 120.0
      nonbus_cvar_penalty: 0.25
      infeasible_action_penalty: 120.0
  reward_clip: [-600, 100]
  eval_bus_flows:
  - name: rc4_changing
    sim_config_overrides:
      iz_bus_timetable_config:
        route_count: 4
        headway_min_seconds: 300.0
        headway_max_seconds: 900.0
        deviation_min_seconds: -120.0
        deviation_max_seconds: 600.0
        route_duration_min_seconds: 10800
        route_duration_max_seconds: 36000
  phase_controller: BasicPhaseController
  num_seconds: 10800
  run_up_time: 3600
  time_to_teleport: 300
  iz_scenario_duration_seconds: 10800
  iz_seed: 3423
  iz_bus_gen_seed: 3423
  iz_n_scenarios: 1
  iz_random_start_time: true
  eval_start_time: 0
  electric_penetration_rate: 0
  bus_vid_prefix: _42.
  eval_episodes: 1
  eval_log_on_step: false
  save_eval_trajectories: false
  morl_eval_log_mode: compact
  morl_eval_log_seed_runs: false
