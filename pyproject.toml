[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "morl-tsp"
version = "0.1.0"
description = "Preference-conditioned multi-objective reinforcement learning for runtime-tunable transit signal priority in SUMO."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
  { name = "Philip-Roman Adam", email = "philip-roman.adam@thi.de" },
]
license = "AGPL-3.0-or-later AND MIT"
license-files = [
  "LICENSE",
  "LICENSES/*",
  "THIRD_PARTY_NOTICES.md",
]
keywords = [
  "Reinforcement Learning",
  "Multi-Objective Reinforcement Learning",
  "Transit Signal Priority",
  "Traffic Signal Control",
  "SUMO",
  "SUMO-RL",
  "IntersectionZoo",
  "PettingZoo",
  "gymnasium",
]
dependencies = [
  "eclipse-sumo==1.25.0",
  "gymnasium>=1.1",
  "libsumo==1.25.0",
  "lxml>=5.3",
  "mo-gymnasium>=1.3.2",
  "morl-baselines>=1.2.0",
  "numpy>=1.26,<2.0",
  "optuna>=4.2",
  "pandas>=2.2",
  "plotly>=6.0",
  "psycopg2-binary>=2.9",
  "python-dotenv>=1.0",
  "sb3-contrib>=2.6.0",
  "scikit-learn>=1.5",
  "sqlalchemy>=2.0",
  "stable-baselines3>=2.6.0",
  "sumolib==1.25.0",
  "tensorboard>=2.19",
  "traci==1.25.0",
  "wandb>=0.19",
]

[project.optional-dependencies]
rendering = ["pyvirtualdisplay>=3.0"]
all = [
  "pyvirtualdisplay>=3.0",
]

[project.urls]
Homepage = "https://github.com/urbanAIthi/morl-tsp"
Repository = "https://github.com/urbanAIthi/morl-tsp"
Issues = "https://github.com/urbanAIthi/morl-tsp/issues"
"Upstream SUMO-RL" = "https://github.com/LucasAlegre/sumo-rl"

[project.scripts]
slurm_experiment = "morl_tsp.experiment.slurm_experiment:main"

[dependency-groups]
dev = [
  "ipykernel>=7.2.0",
  "mypy>=1.15",
  "pytest>=8.3",
  "ruff>=0.11",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["morl_tsp", "morl_tsp.*"]

[tool.setuptools.package-data]
morl_tsp = [
  "experiment/yaml/**/*.yaml",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "-q"
filterwarnings = ["ignore:.*The environment .* is out of date.*"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "morl_tsp.environment.bus",
  "morl_tsp.environment.env",
  "morl_tsp.environment.env_metrics",
  "morl_tsp.environment.intersection_mapper",
  "morl_tsp.environment.observations",
  "morl_tsp.environment.phase_controllers",
  "morl_tsp.environment.reward",
  "morl_tsp.environment.traffic_signal",
  "morl_tsp.environment.ts_metrics",
  "morl_tsp.experiment.callbacks",
  "morl_tsp.experiment.run_experiment",
  "morl_tsp.experiment.run_morl_eval_experiment",
]
ignore_errors = true

# The paper experiments require an installable `intersection_zoo` Python package
# and compatible dataset snapshot. Install that package separately and point
# INTERSECTION_ZOO_ROOT_PATH at it; see README.md.

[tool.pyright]
include = ["."]
